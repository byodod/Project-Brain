name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
      - name: Select pinned Rust toolchain
        run: rustup default 1.92.0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Verify npm distribution tooling
        run: |
          node --test npm/test/*.test.js
          python -B -m unittest discover -s scripts/tests -p "test_*.py" -v
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: project-brain
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            executable: project-brain.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: project-brain
          - os: macos-15
            target: aarch64-apple-darwin
            executable: project-brain
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --target ${{ matrix.target }}
      - name: Select pinned Rust toolchain
        run: rustup default 1.92.0
      - name: Test workspace
        run: cargo test --workspace --all-targets --locked --target ${{ matrix.target }}
      - name: Build release CLI
        run: cargo build --release --locked --target ${{ matrix.target }} -p project-brain
      - name: Qualify release control plane
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.executable }}"
          "$binary" \
            --project-root "$GITHUB_WORKSPACE" \
            --install-root "$RUNNER_TEMP/project-brain-qualification" \
            qualification run \
            --request-id "ci-${{ matrix.target }}-${GITHUB_SHA}"
