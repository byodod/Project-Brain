name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  verify:
    name: Verify release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
      - name: Select pinned Rust toolchain
        run: rustup default 1.92.0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Require tag to match workspace version
        run: python scripts/verify_release_tag.py "${GITHUB_REF_NAME}"
      - name: Verify source gate
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          node --test npm/test/*.test.js
          python -B -m unittest discover -s scripts/tests -p "test_*.py" -v

  build:
    name: Package ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: project-brain
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            executable: project-brain.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: project-brain
          - os: macos-15
            target: aarch64-apple-darwin
            executable: project-brain
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --target ${{ matrix.target }}
      - name: Select pinned Rust toolchain
        run: rustup default 1.92.0
      - name: Build release CLI
        run: cargo build --release --locked --target ${{ matrix.target }} -p project-brain
      - name: Self-check release CLI
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.executable }}"
          "$binary" capabilities codex
          "$binary" capabilities pi
          "$binary" capabilities opencode
          "$binary" capabilities dsh
      - name: Qualify release control plane
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.executable }}"
          "$binary" \
            --project-root "$GITHUB_WORKSPACE" \
            --install-root "$RUNNER_TEMP/project-brain-qualification" \
            qualification run \
            --request-id "release-${{ matrix.target }}-${GITHUB_SHA}"
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle="project-brain-${version}-${{ matrix.target }}"
          mkdir -p "dist/${bundle}"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/${bundle}/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/${bundle}/"
          chmod 755 "dist/${bundle}/${{ matrix.executable }}"
          tar -C dist -czf "dist/project-brain-${version}-${{ matrix.target }}.tar.gz" "${bundle}"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $bundle = "project-brain-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$bundle" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/$bundle/"
          Copy-Item README.md,CHANGELOG.md,LICENSE-MIT,LICENSE-APACHE "dist/$bundle/"
          Compress-Archive -Path "dist/$bundle" -DestinationPath "dist/project-brain-$version-${{ matrix.target }}.zip"
      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  npm-package:
    name: Package npm distribution
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Download native release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist/native
          merge-multiple: true
      - name: Assemble npm package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python scripts/assemble_npm_package.py \
            --dist dist/native \
            --output target/npm-package \
            --version "$version"
          mkdir -p dist/npm
          npm pack ./target/npm-package --pack-destination dist/npm
      - name: Install and smoke-test packed npm CLI
        shell: bash
        run: |
          npm install --prefix target/npm-smoke --ignore-scripts ./dist/npm/*.tgz
          cli="target/npm-smoke/node_modules/.bin/project-brain"
          "$cli" --version
          "$cli" capabilities codex
          "$cli" capabilities pi
          "$cli" capabilities opencode
          "$cli" capabilities dsh
      - name: Upload npm package
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: dist/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [build, npm-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Download npm package
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f \( -name 'project-brain-*.tar.gz' -o -name 'project-brain-*.zip' -o -name 'byodod-project-brain-*.tgz' \) -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 5
      - name: Publish immutable tag assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "Project Brain ${GITHUB_REF_NAME}"

  publish-npm:
    name: Publish npm package
    needs: publish
    if: vars.PROJECT_BRAIN_NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install OIDC-capable npm CLI
        run: npm install --global npm@11.18.0
      - name: Download npm package
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist
      - name: Publish public package with npm OIDC
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm publish "dist/byodod-project-brain-${version}.tgz" --access public
