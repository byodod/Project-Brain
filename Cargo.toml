[workspace]
members = [
    "crates/brain-analyzer",
    "crates/brain-core",
    "crates/brain-evidence",
    "crates/brain-provider-protocol",
    "crates/brain-scip",
    "crates/brain-store",
    "crates/brain-symbols",
    "crates/project-brain",
]
resolver = "3"

[workspace.package]
version = "0.2.8"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
authors = ["byodod", "Project Brain contributors"]

[workspace.dependencies]
atomic-write-file = "=0.3.0"
clap = { version = "4.6.6", features = ["derive"] }
fs2 = "=0.4.3"
protobuf = "=3.7.2"
processkit = { version = "=3.3.2", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
scip = "=0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tree-sitter = "0.26.12"
tree-sitter-rust = "0.24.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
